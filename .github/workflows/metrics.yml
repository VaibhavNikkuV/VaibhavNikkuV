name: Metrics
# Generates assets/metrics.svg (stats, languages, contribution calendar, achievements)
# Requires repo secret METRICS_TOKEN (PAT, read-only). Replaces the dead vercel.app stat cards.
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6 # v3.34 (pinned SHA)
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: assets/metrics.svg
          template: classic
          base: header, activity, community, repositories
          config_timezone: Asia/Calcutta
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_threshold: B
